name: tests

# Runs the release-gate and word-count tests on every push and pull request.
# The suite is offline: it blocks the network and never reaches YouTube.
on: [push, pull_request]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[test]"
      - run: pytest -v
