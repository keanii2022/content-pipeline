# Ledger of creators who have explicitly permitted clipping/reuse of their
# content. Validated against allowlist.schema.json (enforced in code by
# pipeline/permissions/validate.py). Nothing may be fetched for a creator
# that isn't listed here with a matching source_url.
#
# The entry below is a placeholder showing the required shape. Replace it
# with real, verified entries — each backed by actual evidence of the
# permission grant — before fetching any real clips, and remove this
# placeholder once real entries exist.

creators:
