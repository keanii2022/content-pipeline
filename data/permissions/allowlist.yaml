    display_name: "Example Creator"
    platform: youtube
    source_url: "https://www.youtube.com/@example-creator"
    permission_scope: "Clipping and reuse with original commentary, non-monetized reposts only"
    permission_granted_date: "2026-01-01"
    evidence: "PLACEHOLDER - replace with a link/reference to the actual permission grant (email, DM, contract, etc.)"
    conditions: "Credit the original creator in the video description"
