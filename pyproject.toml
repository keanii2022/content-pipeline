[project]
name = "content-pipeline"
version = "0.1.0"
description = "Content-automation pipeline: source permitted clips, add commentary, assemble short-form video. Publishing is manual except for an explicit, human-triggered YouTube Data API upload."
requires-python = ">=3.9"
dependencies = [
    "PyYAML>=6.0",
    "yt-dlp>=2024.1.0",
]

[project.optional-dependencies]
# Only needed for pipeline.publish.youtube — the one deliberate,
# human-triggered exception to "publishing is manual, not automated".
# `pip install -e .[youtube]`
youtube = [
    "google-api-python-client>=2.100.0",
    "google-auth-httplib2>=0.2.0",
    "google-auth-oauthlib>=1.2.0",
]
# Only needed for clip mode (pipeline.clip.transcribe) — local Whisper,
# nothing leaves the machine. `pip install -e ".[clip]"`
clip = [
    "faster-whisper>=1.0",
]
# Only needed for `cut --captions` (pipeline.clip.captions), which draws
# each caption as a PNG. `pip install -e ".[captions]"`
captions = [
    "Pillow>=10.0",
]
# `pip install -e .[test]` — runs offline; the suite mocks every network call.
test = [
    "pytest>=8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pipeline*"]

[tool.setuptools.package-data]
"pipeline.clip" = ["fonts/*.ttf", "fonts/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
