<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>content-pipeline review</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="tabs">
        <button id="tab-jobs" class="tab active" type="button">Staged Jobs</button>
        <button id="tab-runs" class="tab" type="button">Batch Runs</button>
      </div>
      <h1 id="sidebar-title">Staged jobs</h1>
      <ul id="job-list" class="job-list"></ul>
      <ul id="run-list" class="job-list" hidden></ul>
    </aside>
    <main class="detail" id="detail">
      <p class="empty">Select a job from the list to review it.</p>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
